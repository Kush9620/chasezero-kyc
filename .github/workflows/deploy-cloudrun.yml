name: CI/CD — Build & Deploy to Google Cloud Run

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  GCP_REGION: ${{ vars.GCP_REGION || 'asia-south1' }}
  SERVICE_NAME: ${{ vars.SERVICE_NAME || 'northgate-chasezero' }}
  ARTIFACT_REPO: ${{ vars.ARTIFACT_REPO || 'chasezero-repo' }}

jobs:
  test:
    name: 1. Run FastAPI & LangGraph Smoke Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run automated API & LangGraph tests
        run: |
          pytest tests/test_production_compliance.py -v
          python tests/test_ci.py

  deploy:
    name: 2. Build Docker Image & Deploy to Cloud Run
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (Workload Identity Federation or SA Key)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCP Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and Push Docker Container
        env:
          IMAGE_URI: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
        run: |
          docker build -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"

      - name: Deploy to Google Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.GCP_REGION }}
          image: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          flags: "--allow-unauthenticated --port=8080 --memory=512Mi --cpu=1 --min-instances=0 --max-instances=3"
          env_vars: |
            LLM_PROVIDER=google
            LLM_MODEL=gemini-2.5-flash
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}

      - name: Print Live Cloud Run URLs
        run: |
          echo "======================================================"
          echo "🚀 Deployed Live URL: ${{ steps.deploy.outputs.url }}"
          echo "📘 Swagger API Docs:  ${{ steps.deploy.outputs.url }}/docs"
          echo "======================================================"
